[tox]
env_list = py{310,311,312,313}, lint
isolated_build = true

[testenv]
description = run the offline unit tests
extras = cli, test
commands = pytest {posargs:tests}
passenv = *

[testenv:live]
description = run the tests against a real appliance (needs APPLIANCE and PASSWORD)
extras = cli, test
commands = pytest -m live {posargs:tests}
passenv = *

[testenv:lint]
description = ruff + mypy
skip_install = true
deps =
    ruff
    mypy
    types-requests
    types-defusedxml
commands =
    ruff check .
    mypy
